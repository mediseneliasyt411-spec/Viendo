<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Quieres ser mi novia?</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #fbc2eb 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .container {
      background: white;
      padding: 50px 40px;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 420px;
      width: 90%;
      position: relative;
      animation: aparecer 0.8s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: scale(0.8) translateY(30px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .corazon {
      font-size: 70px;
      animation: latir 1.2s infinite;
      margin-bottom: 15px;
    }

    @keyframes latir {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    h1 {
      color: #e91e63;
      font-size: 28px;
      margin-bottom: 12px;
    }

    p {
      color: #666;
      font-size: 17px;
      margin-bottom: 35px;
      line-height: 1.5;
    }

    .botones {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
      height: 55px;
    }

    button {
      padding: 14px 32px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }

    #si {
      background: #e91e63;
      color: white;
    }

    #si:hover {
      background: #c2185b;
      transform: scale(1.08);
      box-shadow: 0 8px 20px rgba(233, 30, 99, 0.4);
    }

    #no {
      background: #f5f5f5;
      color: #555;
      position: absolute;
    }

    #no:hover {
      background: #eeeeee;
    }

    .respuesta {
      display: none;
      animation: aparecer 0.6s ease;
    }

    .respuesta h2 {
      color: #e91e63;
      font-size: 32px;
      margin-bottom: 15px;
    }

    .respuesta p {
      font-size: 18px;
      color: #444;
    }

    .confeti {
      position: fixed;
      width: 12px;
      height: 12px;
      background: #e91e63;
      top: -20px;
      animation: caer 3s linear forwards;
      border-radius: 2px;
    }

    @keyframes caer {
      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container" id="pregunta">
    <div class="corazon">❤️</div>
    <h1>¿Quieres ser mi novia?</h1>
    <p>Sé que es una pregunta importante...<br>pero mi corazón ya eligió.</p>
    
    <div class="botones">
      <button id="si">¡Sí! 💕</button>
      <button id="no">No</button>
    </div>
  </div>

  <div class="container respuesta" id="respuesta">
    <div class="corazon">💖</div>
    <h2>¡Síiiii!</h2>
    <p>¡Ahora oficialmente eres mi novia!<br>Prometo hacerte muy feliz 🥰</p>
  </div>

  <script>
    const btnNo = document.getElementById('no');
    const btnSi = document.getElementById('si');
    const pregunta = document.getElementById('pregunta');
    const respuesta = document.getElementById('respuesta');

    // El botón "No" se escapa
    btnNo.addEventListener('mouseover', () => {
      const x = Math.random() * (window.innerWidth - btnNo.offsetWidth - 40);
      const y = Math.random() * (window.innerHeight - btnNo.offsetHeight - 40);
      
      btnNo.style.position = 'fixed';
      btnNo.style.left = `${x}px`;
      btnNo.style.top = `${y}px`;
    });

    // Cuando dice que sí
    btnSi.addEventListener('click', () => {
      pregunta.style.display = 'none';
      respuesta.style.display = 'block';
      crearConfeti();
    });

    function crearConfeti() {
      const colores = ['#e91e63', '#ff4081', '#f48fb1', '#ce93d8', '#ff80ab', '#ff1744'];
      
      for (let i = 0; i < 80; i++) {
        const confeti = document.createElement('div');
        confeti.classList.add('confeti');
        confeti.style.left = Math.random() * 100 + 'vw';
        confeti.style.background = colores[Math.floor(Math.random() * colores.length)];
        confeti.style.animationDuration = (Math.random() * 2 + 2) + 's';
        confeti.style.animationDelay = Math.random() * 0.5 + 's';
        document.body.appendChild(confeti);

        setTimeout(() => confeti.remove(), 4000);
      }
    }
  </script>
</body>
</html>
