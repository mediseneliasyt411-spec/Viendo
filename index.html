<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perdón</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #f0f4f8 0%, #e2e8f0 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #334155;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 16px;
    }

    p {
      font-size: 17px;
      line-height: 1.6;
      color: #475569;
      margin-bottom: 12px;
    }

    .firma {
      margin-top: 28px;
      font-size: 15px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🙏</div>
    <h1>Perdón</h1>
    <p>No sé exactamente qué te hice…</p>
    <p>Ni si ya me odias o no.</p>
    <p>Solo sé que no era mi intención molestarte.</p>
    <p>De verdad, perdón.</p>
    <div class="firma">— Yo</div>
  </div>
</body>
</html>
