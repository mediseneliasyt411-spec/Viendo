<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una pregunta importante</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(15, 23, 42, 0.3), rgba(15, 23, 42, 0.55));
      z-index: 0;
    }

    .heart {
      position: absolute;
      font-size: 18px;
      opacity: 0.6;
      animation: floatHeart 9s linear infinite;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes floatHeart {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 0.7; }
      90% { opacity: 0.7; }
      100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
      }
    }

    .container {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 50px 45px 45px;
      border-radius: 24px;
      box-shadow: 
        0 32px 64px rgba(0, 0, 0, 0.22),
        0 0 0 1px rgba(255, 255, 255, 0.4);
      text-align: center;
      max-width: 460px;
      width: 91%;
      animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .couple {
      font-size: 64px;
      margin-bottom: 12px;
      display: inline-block;
      animation: gentleBounce 3s ease-in-out infinite;
    }

    @keyframes gentleBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      color: #9f1239;
      font-size: 32px;
      line-height: 1.3;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .subtitle {
      color: #475569;
      font-size: 15.5px;
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    button {
      padding: 15px 38px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 230px;
    }

    #yes {
      background: #be123c;
      color: white;
      box-shadow: 0 10px 25px rgba(190, 18, 60, 0.3);
    }

    #yes:hover {
      background: #9f1239;
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(190, 18, 60, 0.4);
    }

    #no {
      background: transparent;
      color: #64748b;
      border: 1.5px solid #e2e8f0;
    }

    #no:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .response {
      display: none;
      animation: fadeIn 0.8s ease;
    }

    .response .couple {
      font-size: 72px;
    }

    .response h2 {
      font-family: 'Cormorant Garamond', serif;
      color: #9f1239;
      font-size: 30px;
      margin-bottom: 14px;
      line-height: 1.3;
    }

    .response p {
      font-size: 16px;
      color: #475569;
      line-height: 1.7;
    }

    .music-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      border: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
      cursor: pointer;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: all 0.3s ease;
    }

    .music-btn:hover {
      transform: scale(1.1);
      background: white;
    }

    .confetti {
      position: fixed;
      width: 9px;
      height: 9px;
      top: -20px;
      z-index: 100;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(520deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div id="hearts"></div>

  <div class="container" id="question">
    <div class="couple">👩‍❤️‍👨</div>
    <h1>¿Quieres ser mi reina,<br>mi novia, mi todo?</h1>
    <p class="subtitle">
      Hay preguntas que solo se hacen una vez en la vida.<br>
      Esta es la mía.
    </p>

    <div class="buttons">
      <button id="yes">Sí, acepto</button>
      <button id="no">No</button>
    </div>
  </div>

  <div class="container response" id="response">
    <div class="couple">🥰👩‍❤️‍👨</div>
    <h2>Ahora eres oficialmente<br>mi reina</h2>
    <p>
      Gracias por confiar en mí.<br>
      Prometo cuidarte, respetarte y amarte<br>
      cada día de mi vida.
    </p>
  </div>

  <!-- Botón de música -->
  <button class="music-btn" id="musicBtn" title="Música">🎵</button>

  <!-- Música romántica (funciona) -->
  <audio id="bgMusic" loop preload="auto">
    <source src="https://archive.org/download/soundcloud-382924121/Romantic_Piano_-_No_Copyright_Wedding_Background_Music_For_Videos_Films-382924121.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Corazones flotantes
    const heartsContainer = document.getElementById('hearts');
    const heartEmojis = ['💖', '💕', '💗', '💓', '❤️'];

    for (let i = 0; i < 15; i++) {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 5 + 7) + 's';
      heart.style.animationDelay = Math.random() * 8 + 's';
      heart.style.fontSize = (Math.random() * 12 + 14) + 'px';
      heartsContainer.appendChild(heart);
    }

    const btnYes = document.getElementById('yes');
    const btnNo = document.getElementById('no');
    const question = document.getElementById('question');
    const response = document.getElementById('response');
    const musicBtn = document.getElementById('musicBtn');
    const bgMusic = document.getElementById('bgMusic');

    let isPlaying = false;

    // Intentar reproducir automáticamente al cargar
    window.addEventListener('load', () => {
      bgMusic.volume = 0.6;
      const playPromise = bgMusic.play();
      
      if (playPromise !== undefined) {
        playPromise.then(() => {
          isPlaying = true;
          musicBtn.textContent = '🔊';
        }).catch(() => {
          // El navegador bloqueó el autoplay (normal)
          isPlaying = false;
          musicBtn.textContent = '🎵';
        });
      }
    });

    // Botón de música
    musicBtn.addEventListener('click', () => {
      if (isPlaying) {
        bgMusic.pause();
        musicBtn.textContent = '🎵';
      } else {
        bgMusic.play();
        musicBtn.textContent = '🔊';
      }
      isPlaying = !isPlaying;
    });

    btnYes.addEventListener('click', () => {
      question.style.display = 'none';
      response.style.display = 'block';
      createConfetti();

      // Asegurar que suene la música al aceptar
      if (!isPlaying) {
        bgMusic.play();
        isPlaying = true;
        musicBtn.textContent = '🔊';
      }
    });

    btnNo.addEventListener('click', () => {
      alert('Está bien… el botón de arriba seguirá esperando 🥺');
    });

    function createConfetti() {
      const colors = ['#be123c', '#e11d48', '#fb7185', '#fda4af', '#fecdd3', '#9f1239'];
      
      for (let i = 0; i < 90; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.width = (Math.random() * 7 + 6) + 'px';
        confetti.style.height = confetti.style.width;
        confetti.style.animationDuration = (Math.random() * 2.2 + 2.6) + 's';
        confetti.style.animationDelay = Math.random() * 0.6 + 's';
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 4500);
      }
    }
  </script>
</body>
</html>
